name = "blob-agent" 
main = "src/index.ts"
compatibility_date = "2024-04-03"

[triggers]
crons = ["*/5 * * * *", "0 0 * * 0"]

[[durable_objects.bindings]]
name = "BLOB"
class_name = "BlobDO"

[[containers]]
class_name = "BlobSandbox"
image = "./sandbox/Dockerfile"
max_instances = 3

[[durable_objects.bindings]]
name = "BLOB_SANDBOX"
class_name = "BlobSandbox"

[[migrations]]
tag = "v1"
new_classes = ["BlobDO", "BlobSandbox"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability]
[observability.logs]
enabled = true
invocation_logs = true