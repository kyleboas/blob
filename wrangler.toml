name = "blob-agent" 
main = "src/index.ts"
compatibility_date = "2025-12-01"

[[durable_objects.bindings]]
name = "BLOB"
class_name = "AgentDO"

[[migrations]]
tag = "v1"
new_classes = ["AgentDO"]

# NOTE: Container binding configured via Cloudflare Dashboard
