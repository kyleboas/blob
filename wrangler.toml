name = "blob-agent"
main = "src/index.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"

[[durable_objects.bindings]]
name = "SANDBOX_DO"
class_name = "SandboxDO"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SandboxDO"]
deleted_classes = ["Sandbox"]

[[r2_buckets]]
binding = "REPO_STORE"
bucket_name = "blob-repo-store"

[[containers]]
name = "sandbox"
class_name = "SandboxDO"
image = "./sandbox/Dockerfile"

[observability.logs]
enabled = true