name = "blob-agent"
main = "src/index.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AgentDO"]

[[r2_buckets]]
binding = "REPO_STORE"
bucket_name = "blob-repo-store"

# Service binding to sandbox worker (simpler than container binding)
[[services]]
binding = "SANDBOX"
service = "blob-agent-sandbox"
environment = "production"

# Workers AI binding - no configuration needed, works out of the box
[ai]
binding = "AI"

[observability.logs]
enabled = true
