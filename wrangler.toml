name = "blob-agent"
main = "src/index.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"
script_name = "blob-agent"

[[durable_objects.bindings]]
name = "SANDBOX_DO"
class_name = "Sandbox"
script_name = "blob-agent-sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDO"]

[[migrations]]
tag = "v2"
new_classes = ["Sandbox"]

[[r2_buckets]]
binding = "REPO_STORE"
bucket_name = "blob-repo-store"

[[containers]]
name = "sandbox"
class_name = "Sandbox"
image = "./sandbox/Dockerfile"

[ai]
binding = "AI"

[observability.logs]
enabled = true