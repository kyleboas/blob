name = "blob-agent"
main = "src/index.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

[vars]
# Cloudflare AI Gateway – set CF_ACCOUNT_ID and CF_AI_GATEWAY_ID to route all
# LLM calls through the gateway (analytics, caching, rate limiting, fallback).
# The provider is derived automatically from the model name prefix
# (e.g. "openai/gpt-4.1-mini" → openai, "anthropic/claude-sonnet-4-6" → anthropic).
# CF_ACCOUNT_ID = ""
# CF_AI_GATEWAY_ID = ""

# API keys for each provider tier:
#   ANTHROPIC_API_KEY  – complex tier (claude-sonnet-4-6)  [set as a Worker secret]
#   OPENAI_API_KEY     – routine tier  (gpt-4.1-mini)      [set as a Worker secret]

[[durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDO"]

[[r2_buckets]]
binding = "REPO_STORE"
bucket_name = "blob-repo-store"

[[services]]
binding = "SANDBOX"
service = "blob-agent-sandbox"
environment = "production"

[observability.logs]
enabled = true
