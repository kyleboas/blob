name = "blob-agent"
main = "src/index.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDO"]

# Preserve migration history for previously published Worker versions.
[[migrations]]
tag = "v2"

[[r2_buckets]]
binding = "REPO_STORE"
bucket_name = "blob-repo-store"

# Service binding to sandbox worker
[[services]]
binding = "SANDBOX"
service = "blob-agent-sandbox"
environment = "production"

[ai] 
binding = "AI"

[observability.logs]
enabled = true
