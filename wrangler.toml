name = "blob-agent" 
main = "src/index.ts"
compatibility_date = "2025-12-01"

[[durable_objects.bindings]]
name = "BLOB"
class_name = "AgentDO"

[[migrations]]
tag = "v1"
new_classes = ["AgentDO"]

# Container binding
[[containers]]
binding = "SANDBOX"
name = "sandbox"
image = "./sandbox/Dockerfile"
max_instances = 3

[observability]
[observability.logs]
enabled = true
invocation_logs = true