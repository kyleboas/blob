name = "blob-agent" 
main = "src/index.ts"
compatibility_date = "2024-04-03"

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "REPO_CONFIG"
class_name = "AgentDO"

[[durable_objects.bindings]]
name = "MEMORY"
class_name = "MemoryDO"

[[migrations]]
tag = "v1"
new_classes = ["AgentDO", "MemoryDO"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true