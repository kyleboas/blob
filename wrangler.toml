name = "blob-agent" 
main = "src/index.ts"
compatibility_date = "2025-12-01"

[[durable_objects.bindings]]
name = "BLOB"
class_name = "AgentDO"

[[migrations]]
tag = "v1"
new_classes = ["AgentDO"]

# Container binding - this creates env.SANDBOX
[[containers]]
name = "SANDBOX"
class_name = "SandboxContainer"
image = "./sandbox/Dockerfile"

[observability]
[observability.logs]
enabled = true
invocation_logs = true