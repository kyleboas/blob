[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-modifying-agent"
version = "0.1.0"
description = "Minimal self-modifying AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic",
  "slack-bolt",
  "slack-sdk",
  "pytest",
  "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
