app = "self-modifying-agent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  AGENT_ENV = "prod"

[[mounts]]
  source = "agent_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
