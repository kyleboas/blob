name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing Cloudflare API token. Set CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) in repo secrets."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing Cloudflare account id. Set CLOUDFLARE_ACCOUNT_ID (or CF_ACCOUNT_ID) in repo secrets."
            exit 1
          fi

      - name: Verify Wrangler authentication
        run: npx wrangler whoami

      - name: Check Cloudflare Containers access
        run: |
          echo "Verifying Cloudflare Containers access..."
          if ! npx wrangler containers images list 2>&1; then
            echo ""
            echo "ERROR: Cannot access Cloudflare Containers."
            echo "Cloudflare Containers requires:"
            echo "  1. A paid Cloudflare Workers plan"
            echo "  2. An API token with 'Workers Scripts: Edit' and 'Cloudflare Containers: Edit' permissions"
            echo "  See: https://developers.cloudflare.com/containers/get-started/"
            exit 1
          fi

      - name: Deploy sandbox worker
        run: npx wrangler deploy --config sandbox/wrangler.toml

      - name: Deploy main worker
        run: npx wrangler deploy
