name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-sandbox:
    runs-on: ubuntu-latest
    name: Deploy blob-sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy -c wrangler.sandbox.toml

  deploy-agent:
    runs-on: ubuntu-latest
    name: Deploy blob-agent
    needs: deploy-sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Create Vectorize index (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: vectorize create blob-vectors --dimensions=384 --metric=cosine
        continue-on-error: true

      - name: Provision KV + generate wrangler.toml (no hardcoded IDs)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Ensure wrangler v4 is available for the run steps
          npx --yes wrangler@4 --version

          # --- KV: prod namespace ---
          PROD_ID="$(npx --yes wrangler@4 kv namespace list --json \
            | jq -r '.[] | select(.title=="blob-memory") | .id' | head -n1 || true)"

          if [ -z "${PROD_ID:-}" ] || [ "${PROD_ID}" = "null" ]; then
            echo "Creating KV namespace: blob-memory"
            PROD_ID="$(npx --yes wrangler@4 kv namespace create blob-memory --json | jq -r '.id')"
          fi

          # --- KV: preview namespace (separate namespace name) ---
          PREVIEW_ID="$(npx --yes wrangler@4 kv namespace list --json \
            | jq -r '.[] | select(.title=="blob-memory-preview") | .id' | head -n1 || true)"

          if [ -z "${PREVIEW_ID:-}" ] || [ "${PREVIEW_ID}" = "null" ]; then
            echo "Creating KV namespace: blob-memory-preview"
            PREVIEW_ID="$(npx --yes wrangler@4 kv namespace create blob-memory-preview --json | jq -r '.id')"
          fi

          echo "KV PROD_ID=${PROD_ID}"
          echo "KV PREVIEW_ID=${PREVIEW_ID}"

          # Generate wrangler.toml from template
          cp wrangler.toml.template wrangler.toml
          sed -i "s/__BLOB_MEMORY_ID__/${PROD_ID}/g" wrangler.toml
          sed -i "s/__BLOB_MEMORY_PREVIEW_ID__/${PREVIEW_ID}/g" wrangler.toml

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy -c wrangler.toml
