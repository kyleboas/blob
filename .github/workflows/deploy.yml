name: Deploy Sandbox Worker

on:
  push:
    branches: [main]
    paths:
      - "wrangler.sandbox.toml"
      - "src/sandbox-worker.ts"
      - "sandbox/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-sandbox.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-sandbox
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Deploy sandbox worker (blob-sandbox)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.sandbox.toml