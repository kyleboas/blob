name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing Cloudflare API token. Set CLOUDFLARE_API_TOKEN (or CF_API_TOKEN) in repo secrets."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing Cloudflare account id. Set CLOUDFLARE_ACCOUNT_ID (or CF_ACCOUNT_ID) in repo secrets."
            exit 1
          fi

      - name: Verify Wrangler authentication
        run: npx wrangler whoami

      - name: Deploy sandbox worker
        id: deploy_sandbox
        continue-on-error: true
        run: npx wrangler deploy --config sandbox/wrangler.toml

      - name: Warn if sandbox deploy failed
        if: steps.deploy_sandbox.outcome == 'failure'
        run: |
          echo "::warning::Sandbox worker deploy failed."
          echo "::warning::Cloudflare Containers (used by blob-agent-sandbox) is in public beta"
          echo "::warning::and has a known API token authorization bug (workers-sdk#12483):"
          echo "::warning::  https://github.com/cloudflare/workers-sdk/issues/12483"
          echo "::warning::Even a token with 'containers (write)' scope may be rejected."
          echo "::warning::Workaround: deploy the sandbox manually from a machine logged in via"
          echo "::warning::  'npx wrangler login' (OAuth) rather than an API token, e.g.:"
          echo "::warning::  npx wrangler deploy --config sandbox/wrangler.toml"
          echo "::warning::The main blob-agent worker has been deployed. Bash tool execution"
          echo "::warning::will be unavailable until the sandbox is deployed successfully."

      - name: Deploy main worker
        run: npx wrangler deploy
