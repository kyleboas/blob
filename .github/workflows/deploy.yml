name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-sandbox:
    runs-on: ubuntu-latest
    name: Deploy blob-sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy -c wrangler.sandbox.toml

  deploy-agent:
    runs-on: ubuntu-latest
    name: Deploy blob-agent
    needs: deploy-sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Create Vectorize index (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: vectorize create blob-vectors --dimensions=384 --metric=cosine
        continue-on-error: true

      - name: Provision KV + generate wrangler.toml (no hardcoded IDs)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # Ensure wrangler v4 is available for the run steps
          npx --yes wrangler@4 --version

          API_BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"

          ensure_namespace() {
            local namespace_title="$1"
            local namespace_id

            namespace_id="$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "${API_BASE}?per_page=100" \
              | jq -r --arg title "${namespace_title}" '.result[] | select(.title==$title) | .id' \
              | head -n1 || true)"

            if [ -z "${namespace_id:-}" ] || [ "${namespace_id}" = "null" ]; then
              echo "Creating KV namespace: ${namespace_title}"
              namespace_id="$(curl -fsS -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "${API_BASE}" \
                --data "$(jq -cn --arg title "${namespace_title}" '{title:$title}')" \
                | jq -r '.result.id')"
            fi

            if [ -z "${namespace_id:-}" ] || [ "${namespace_id}" = "null" ]; then
              echo "Failed to ensure namespace '${namespace_title}'" >&2
              exit 1
            fi

            printf '%s\n' "${namespace_id}"
          }

          # --- KV: prod + preview namespaces ---
          PROD_ID="$(ensure_namespace blob-memory)"
          PREVIEW_ID="$(ensure_namespace blob-memory-preview)"

          echo "KV PROD_ID=${PROD_ID}"
          echo "KV PREVIEW_ID=${PREVIEW_ID}"

          # Generate wrangler.toml from template
          cp wrangler.toml.template wrangler.toml
          sed -i "s/__BLOB_MEMORY_ID__/${PROD_ID}/g" wrangler.toml
          sed -i "s/__BLOB_MEMORY_PREVIEW_ID__/${PREVIEW_ID}/g" wrangler.toml

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy -c wrangler.toml
