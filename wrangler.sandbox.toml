name = "blob-sandbox"
main = "src/sandbox-worker.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

[[containers]]
name = "sandbox"
class_name = "Sandbox"
image = "./sandbox/Dockerfile"

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[observability.logs]
enabled = true