name = "blob-agent"
main = "src/index.ts"
compatibility_date = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT_DO"
class_name = "AgentDO"

[[r2_buckets]]
binding = "REPO_STORE"
bucket_name = "blob-repo-store"

[[services]]
binding = "SANDBOX"
service = "blob-sandbox"
environment = "production"

[ai] 
binding = "AI"

[[migrations]]
tag = "v3"

[observability.logs]
enabled = true

[triggers]
crons = ["*/15 * * * *", "0 */6 * * *", "30 */6 * * *"]

[[vectorize]]
binding = "PI_VECTORS"
index_name = "blob-memory-index"
